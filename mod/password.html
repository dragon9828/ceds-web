<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="../svg/favicon.svg" type="image/svg+xml">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · CE神龙工作室</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #12171d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }

    .login-card {
      max-width: 420px;
      width: 100%;
      background: #1e262f;
      padding: 2.8rem 2.2rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7), 0 4px 12px rgba(0, 0, 0, 0.4);
      border: 1px solid #2f3b48;
      border-radius: 0;
    }

    .login-card:hover {
      border-color: #4a5b6b;
    }

    .back-link {
      display: inline-block;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      padding: 0.3rem 0.8rem;
      border: 1px solid #2f3b48;
      transition: background 0.2s;
    }

    .back-link:hover {
      background: #1f2a36;
      border-color: #58a6ff;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #eef4fa;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 2px solid #2f3b48;
      padding-bottom: 0.7rem;
    }

    h1 small {
      font-size: 0.8rem;
      font-weight: 400;
      color: #8aa3b9;
      background: #28333f;
      padding: 0.15rem 0.9rem;
      margin-left: 0.25rem;
      border-radius: 0;
    }

    .subhead {
      color: #b3c9dd;
      font-weight: 400;
      font-size: 0.9rem;
      margin: 0.8rem 0 2rem 0;
      border-left: 4px solid #3f5f7a;
      padding-left: 1rem;
      background: rgba(60, 90, 120, 0.08);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1.7rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #cbdae7;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #0f151c;
      border: 1px solid #2f3b48;
      border-radius: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .input-wrapper:focus-within {
      border-color: #6c8ca8;
      box-shadow: 0 0 0 3px rgba(80, 130, 180, 0.25), inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: #eef4fa;
      outline: none;
      font-weight: 450;
    }

    .input-wrapper input::placeholder {
      color: #5e7488;
      font-weight: 350;
    }

    .input-icon {
      padding: 0 0.5rem 0 1rem;
      color: #6c8aa3;
      font-size: 1.1rem;
      user-select: none;
      opacity: 0.8;
    }

    .password-toggle {
      background: transparent;
      border: none;
      padding: 0 1rem 0 0.2rem;
      cursor: pointer;
      color: #7a94ab;
      font-size: 1rem;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: #bfd6ea;
    }

    .hint-badge {
      display: inline-block;
      margin-top: 0.6rem;
      font-size: 0.7rem;
      background: #1b2531;
      padding: 0.25rem 1rem;
      color: #aec3d7;
      letter-spacing: 0.02em;
      border: 1px solid #2f3b48;
      border-radius: 0;
    }

    .hint-badge code {
      background: #0f151c;
      padding: 0.1rem 0.6rem;
      font-size: 0.7rem;
      color: #d6e4f0;
      border: 1px solid #2f3b48;
      border-radius: 0;
    }

    .login-btn {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #2b4c66;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid #3d617e;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s, border-color 0.2s;
      box-shadow: 0 6px 0 #0f1a24;
      letter-spacing: 0.5px;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border-radius: 0;
      text-transform: uppercase;
    }

    .login-btn:hover {
      background: #1f405a;
      border-color: #4f7a9a;
      box-shadow: 0 6px 0 #0a131c;
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f1a24;
    }

    .login-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.3);
      transform: translateY(2px);
      box-shadow: 0 4px 0 #0f1a24;
    }

    .message-box {
      margin-top: 2rem;
      padding: 0.9rem 1.2rem;
      border: 1px solid #2f3b48;
      font-size: 0.9rem;
      min-height: 4rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      transition: all 0.2s ease;
      background: #141c25;
      border-radius: 0;
    }

    .message-box.error {
      background: #2a1c1f;
      border-color: #8f4a4a;
      color: #f0bdbd;
    }

    .message-box.success {
      background: #1a2a24;
      border-color: #4f8a74;
      color: #b8e0cf;
    }

    .message-box.info {
      background: #18222d;
      border-color: #3a5b74;
      color: #c5dae9;
    }

    .message-box .msg-icon {
      font-size: 1.3rem;
    }

    .footer-note {
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #6c879d;
      text-align: center;
      border-top: 1px solid #2a3643;
      padding-top: 1.4rem;
      letter-spacing: 0.3px;
    }

    .footer-note span {
      background: #18222d;
      padding: 0.2rem 0.9rem;
      border: 1px solid #2f3b48;
      border-radius: 0;
    }

    .return-home {
      display: none;
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: #1a3d2e;
      color: #b8e0cf;
      font-weight: 600;
      font-size: 1rem;
      border: 1px solid #3d7a5e;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      border-radius: 0;
      text-transform: uppercase;
      text-align: center;
      text-decoration: none;
      margin-top: 1rem;
    }

    .return-home:hover {
      background: #23553e;
      border-color: #4f8a74;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.2rem;
      }
      h1 {
        font-size: 1.6rem;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>

<div class="login-card">
  <a href="../index.html" class="back-link">← 返回首页</a>

  <h1>
     登录
    <small>SHA-256</small>
  </h1>
  <div class="subhead">
     密码经哈希处理 · 静态比对
  </div>

  <!-- 登录表单 -->
  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="username"> 用户名</label>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" id="username" placeholder="输入用户名" value="admin" required>
      </div>
    </div>

    <div class="form-group">
      <label for="password"> 密码</label>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" placeholder="输入密码" value="123456" required>
        <button type="button" class="password-toggle" id="togglePassword" aria-label="显示/隐藏密码">
          显示
        </button>
      </div>
      <div class="hint-badge">
        💡 默认账户: admin / 123456
      </div>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span></span> 登录 · 验证哈希
    </button>
  </form>

  <!-- 登录成功后的返回首页按钮 -->
  <a href="../index.html" class="return-home" id="returnHomeBtn">
    🏠 返回首页
  </a>

  <!-- 消息区域 -->
  <div id="messageBox" class="message-box info">
    <span class="msg-icon">ℹ️</span>
    <span id="messageText">等待验证…</span>
  </div>

  <div class="footer-note">
    <span>✧ 静态服务器 · 哈希比对 ✧</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ---- 用户列表配置 ----
    // 在这里添加/删除用户
    // 密码哈希可以使用浏览器控制台生成
    const USERS = [
      {
        username: 'admin',
        passwordHash: '8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92' // 密码: 123456
      },
      {
        username: 'cassia',
        passwordHash: '3a5e1e20fff78d793b949acacb7f022dbf7ea8da73f9ac993071350ec9a6fc84'
      },
      {
        username: 'ceds',
        passwordHash: 'ef797c8118f02dfb649607dd5d3f8c7623048c9c063d532cc95c5ed7a898a64f'
      },
      // 可以继续添加更多用户
      // {
      //     username: 'your_username',
      //     passwordHash: 'your_password_hash' // 使用下方工具生成
      // }
    ];

    // ---- DOM 引用 ----
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const loginBtn = document.getElementById('loginBtn');
    const returnHomeBtn = document.getElementById('returnHomeBtn');
    const messageBox = document.getElementById('messageBox');
    const messageText = document.getElementById('messageText');

    // ---- 工具函数: ArrayBuffer -> 十六进制 ----
    function bufferToHex(buffer) {
      const byteArray = new Uint8Array(buffer);
      let hex = '';
      for (let i = 0; i < byteArray.length; i++) {
        const byte = byteArray[i];
        hex += byte.toString(16).padStart(2, '0');
      }
      return hex;
    }

    // ---- SHA-256 哈希函数 ----
    async function sha256Hash(message) {
      const encoder = new TextEncoder();
      const data = encoder.encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      return bufferToHex(hashBuffer);
    }

    // ---- 更新消息框 ----
    function setMessage(message, type = 'info') {
      messageText.textContent = message;
      messageBox.classList.remove('error', 'success', 'info');
      if (type === 'error') {
        messageBox.classList.add('error');
        messageBox.querySelector('.msg-icon').textContent = '❌';
      } else if (type === 'success') {
        messageBox.classList.add('success');
        messageBox.querySelector('.msg-icon').textContent = '✅';
      } else {
        messageBox.classList.add('info');
        messageBox.querySelector('.msg-icon').textContent = 'ℹ️';
      }
    }

    // ---- 显示/隐藏返回首页按钮 ----
    function showReturnButton(show) {
      returnHomeBtn.style.display = show ? 'block' : 'none';
    }

    // ---- 登录表单提交处理 ----
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      // 基础验证
      if (!username || !password) {
        setMessage('⚠️ 用户名和密码都不能为空', 'error');
        showReturnButton(false);
        return;
      }

      // 禁用按钮，显示计算中
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>⏳</span> 哈希计算中…';
      setMessage('⏳ 正在计算 SHA-256 哈希…', 'info');
      showReturnButton(false);

      try {
        // 1. 对密码进行 SHA-256 哈希
        const hashedPassword = await sha256Hash(password);

        // 2. 在用户列表中查找匹配的用户
        const matchedUser = USERS.find(user => user.username === username);

        if (matchedUser) {
          // 用户名存在，检查密码哈希是否匹配
          if (hashedPassword === matchedUser.passwordHash) {
            // 登录成功
            setMessage(`✅ 登录成功！欢迎 ${username} (哈希匹配)`, 'success');
            showReturnButton(true);
            // 使用 sessionStorage 存储登录状态（关闭浏览器/标签页后自动清除）
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('username', username);
            sessionStorage.setItem('loginTime', new Date().toISOString());
          } else {
            // 密码错误
            setMessage(`❌ 密码错误 · 哈希不匹配`, 'error');
            showReturnButton(false);
          }
        } else {
          // 用户名不存在，显示可用用户列表
          const availableUsers = USERS.map(u => u.username).join(', ');
          setMessage(`❌ 用户 "${username}" 不存在 (可用用户: ${availableUsers})`, 'error');
          showReturnButton(false);
        }
      } catch (err) {
        console.error('哈希计算错误:', err);
        setMessage('⚠️ 哈希计算失败，请重试或检查浏览器支持', 'error');
        showReturnButton(false);
      } finally {
        // 恢复按钮
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span></span> 登录 · 验证哈希';
      }
    });

    // ---- 显示/隐藏密码 ----
    togglePasswordBtn.addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '显示' : '隐藏';
    });

    // ---- 页面加载完成 ----
    window.addEventListener('DOMContentLoaded', () => {
      // 显示可用用户列表
      const userList = USERS.map(u => u.username).join(', ');
      setMessage(`)`, 'info');
      showReturnButton(false);
      if (!usernameInput.value) usernameInput.value = 'admin';
      if (!passwordInput.value) passwordInput.value = '123456';
    });

    // ---- 输入框变化时重置消息 ----
    passwordInput.addEventListener('input', function() {
      const msg = messageText.textContent;
      if (msg.includes('成功') || msg.includes('错误') || msg.includes('失败') || msg.includes('不存在')) {
        const userList = USERS.map(u => u.username).join(', ');
        setMessage(`✏️ 密码已修改，重新验证 (可用用户: ${userList})`, 'info');
        showReturnButton(false);
      }
    });

    usernameInput.addEventListener('input', function() {
      const msg = messageText.textContent;
      if (msg.includes('成功') || msg.includes('错误') || msg.includes('失败') || msg.includes('不存在')) {
        const userList = USERS.map(u => u.username).join(', ');
        setMessage(`✏️ 用户名已修改，重新验证 (可用用户: ${userList})`, 'info');
        showReturnButton(false);
      }
    });

  })();
</script>

</body>
</html>
