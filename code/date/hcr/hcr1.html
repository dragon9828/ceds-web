<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="../../../svg/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火柴人钓鱼记：目录</title>
    <style>
        /* ========== 全局重置 & 方角 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border-radius: 0 !important;
        }

        :root {
            --primary: #1e90ff;
            --primary-deep: #0a6eb4;
            --primary-dark: #085a94;
            --text-dark: #0f2b40;
            --text-mid: #4a6273;
            --text-light: #8aa0b0;
            --bg-soft: #f2f8fd;
            --line: #dce9f5;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-dark);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ========== 顶部导航 ========== */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background-color: var(--primary-dark);
            z-index: 1000;
            transition: transform 0.4s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        .nav-container {
            max-width: 1280px;
            height: 100%;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-links { display: flex; gap: 4px; }
        .nav-link {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 15px;
            padding: 8px 18px;
            transition: background-color 0.2s, color 0.2s;
        }
        .nav-link:hover,
        .nav-link.active {
            background-color: var(--primary);
            color: #ffffff;
        }

        /* ========== 主内容区 ========== */
        .main-content { padding-top: 64px; }

        /* ========== 通用容器 ========== */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ========== 分类卡片 ========== */
        .categories {
            padding: 60px 0 20px;
        }

        /* 竖向排列的容器 */
        .category-grid {
            display: flex;
            flex-direction: column;  /* 竖向排列 */
            align-items: center;     /* 居中 */
            gap: 20px;               /* 图片间距 */
        }

        /* 统一控制图片尺寸，不裁剪 */
        .category-grid img {
            max-width: 100%;         /* 绝不超过容器宽度 */
            max-height: 800px;       /* 限制最大高度，按需调整 */
            width: auto;             /* 宽度自动，保持比例 */
            height: auto;            /* 高度自动，保持比例 */
            object-fit: contain;     /* 完整显示，不裁剪 */
            display: block;          /* 消除底部空隙 */
        }

        /* ========== 响应式 ========== */
        @media (max-width: 860px) {
            .support-hero h1 { font-size: 34px; }
        }

        @media (max-width: 640px) {
            .nav-links { display: none; }
            .category-grid { grid-template-columns: 1fr; }
            .support-hero h1 { font-size: 28px; letter-spacing: 2px; }
            .hero-search button { padding: 12px; }
        }
    </style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<header class="top-nav" id="topNav">
    <div class="nav-container">
        <div class="logo">
            <img src="../../../svg/favicon.svg" alt="">目录
        </div>
        <nav class="nav-links">
            <a href="../../../index.html" class="nav-link">首页</a>
            <a href="#" class="nav-link">更多作品</a>
            <a href="../../tool.html" class="nav-link">工具</a>
            <a href="../../lib.html" class="nav-link active">支持</a>
        </nav>
    </div>
</header>

<main class="main-content">

    <!-- ===== 帮助分类 ===== -->
    <section class="categories">
        <div class="container">
            <h2>全球钓鱼大赛|</h2>
            <div class="category-grid">
                <img src="images/4.jpg" alt="4">
                <img src="images/5.jpg" alt="5">
                <img src="images/6.jpg" alt="6">
                <img src="images/7.jpg" alt="7">
                <img src="images/8.jpg" alt="8">
                <img src="images/9.jpg" alt="9">
                <a href="hcr2.html">下一章</a>
                <a href="hcr.html">上一章</a>
            </div>
        </div>
    </section>

</main>

</body>
</html>
