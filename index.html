<!DOCTYPE html>

<head>

<header class="top-nav" id="topNav">
    <div class="nav-container">
        <div class="logo">
            <img class="logo-icon" src="svg/favicon.svg"> ce神龙工作室
        </div>
        <nav class="nav-links">
            <a href="#" class="nav-link active">首页</a>

            <a href="code/lib.html" class="nav-link">支持</a>
        </nav>
    </div>
</header>

<main class="main-content">
    <!-- 轮播图区域 -->
    <section class="carousel-section">
        <div class="carousel-container" id="carousel">
            <div class="carousel-slides">
                <!-- 轮播项1：data-bg 填图片路径；留空则使用渐变色 -->
                <div class="carousel-slide active"
                     data-bg="images/banner1.png"
                     style="background: linear-gradient(135deg, #1e90ff, #6cb4ee);">
                    <div class="slide-content">
                        <h2>cassia_seedling</h2>
                        <p>我们的工作室</p>
                    </div>
                </div>
                <!-- 轮播项2 -->
                <div class="carousel-slide"
                     data-bg="images/banner2.png"
                     style="background: linear-gradient(135deg, #0a6eb4, #2a9df4);">
                    <div class="slide-content">
                        <h2>竹溪演义</h2>
                        <p>2.5d游戏</p>
                    </div>
                </div>
                <!-- 轮播项3 -->
                <div class="carousel-slide"
                     data-bg="images/banner3.png"
                     style="background: linear-gradient(135deg, #1470af, #4db8ff);">
                    <div class="slide-content">
                        <h2>Minecraft mod</h2>
                        <p>与我们一起构建未来</p>
                    </div>
                </div>
            </div>
            <!-- 轮播指示器 -->
            <div class="carousel-indicators">
                <span class="indicator active" data-index="0"></span>
                <span class="indicator" data-index="1"></span>
                <span class="indicator" data-index="2"></span>
            </div>
            <!-- 左右箭头 -->
            <button class="carousel-arrow prev" id="prevSlide">‹</button>
            <button class="carousel-arrow next" id="nextSlide">›</button>
        </div>
    </section>

    <!-- 公告栏 -->
    <section class="announcement-section">
        <div class="announcement-container">
            <div class="announcement-badge">公告</div>
            <div class="announcement-text" id="announcementText">
                欢迎来到ce神龙工作室！最新项目《竹溪演义》现已开启测试。
            </div>
        </div>
    </section>

    <!-- 3个项目展示卡片 -->
    <section class="projects-section">
        <h3 class="section-title">项目</h3>
        <div class="projects-grid">
            <div class="project-card">
                <div class="project-icon">□</div>
                <h4>竹溪演义</h4>
                <p>2.5d游戏</p>
                <a href="mod/mod/cmake-build-debug.zip" class="project-link">下载zip</a>
            </div>
            <div class="project-card">
                <div class="project-icon">□</div>
                <h4>决明的生物群系</h4>
                <p>我的世界neoforge模组</p>
                <a href="mod/mod/决明的生物群系-1.0.0-neoforge-1.21.4.jar" class="project-link">了解详情 →</a>
            </div>
            <div class="project-card">
                <div class="project-icon">□</div>
                <h4>矿石复兴</h4>
                <p>我的世界neoforge模组</p>
                <a href="mod/mod/矿石复兴-1.0.0-neoforge-1.21.4.jar" class="project-link">了解详情 →</a>
            </div>
        </div>
    </section>
</main>
